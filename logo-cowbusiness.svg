<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="100%" style="stop-color:#c8963e"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="400" height="120" rx="12" fill="url(#dark)"/>
  
  <!-- Ícone de vaca estilizado -->
  <g transform="translate(20, 20)">
    <!-- Cabeça -->
    <ellipse cx="40" cy="45" rx="35" ry="30" fill="url(#gold)"/>
    <!-- Orelhas -->
    <ellipse cx="10" cy="35" rx="12" ry="8" fill="url(#gold)" transform="rotate(-20 10 35)"/>
    <ellipse cx="70" cy="35" rx="12" ry="8" fill="url(#gold)" transform="rotate(20 70 35)"/>
    <!-- Chifres -->
    <path d="M 15 20 Q 10 5 20 10" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 65 20 Q 70 5 60 10" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Olhos -->
    <circle cx="28" cy="40" r="4" fill="#0a0a0a"/>
    <circle cx="52" cy="40" r="4" fill="#0a0a0a"/>
    <!-- Brilho nos olhos -->
    <circle cx="29" cy="39" r="1.5" fill="#fff"/>
    <circle cx="53" cy="39" r="1.5" fill="#fff"/>
    <!-- Focinho -->
    <ellipse cx="40" cy="58" rx="18" ry="12" fill="#f5f5f5"/>
    <!-- Nariz -->
    <ellipse cx="33" cy="56" rx="3" ry="2" fill="#0a0a0a"/>
    <ellipse cx="47" cy="56" rx="3" ry="2" fill="#0a0a0a"/>
    <!-- Sorriso -->
    <path d="M 32 62 Q 40 68 48 62" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Texto -->
  <text x="100" y="55" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
    Cow<tspan fill="url(#gold)">Business</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="100" y="80" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">
    PREMIUM QUALITY
  </text>
  
  <!-- Linha decorativa -->
  <rect x="100" y="90" width="60" height="2" fill="url(#gold)" rx="1"/>
</svg>