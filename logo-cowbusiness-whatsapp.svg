<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="100%" style="stop-color:#c8963e"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo quadrado -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Círculo decorativo de fundo -->
  <circle cx="250" cy="200" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="250" cy="200" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.2"/>
  
  <!-- Ícone de vaca estilizado -->
  <g transform="translate(150, 80)">
    <!-- Cabeça -->
    <ellipse cx="100" cy="100" rx="80" ry="70" fill="url(#goldGrad)"/>
    <!-- Orelhas -->
    <ellipse cx="25" cy="75" rx="28" ry="18" fill="url(#goldGrad)" transform="rotate(-20 25 75)"/>
    <ellipse cx="175" cy="75" rx="28" ry="18" fill="url(#goldGrad)" transform="rotate(20 175 75)"/>
    <!-- Chifres -->
    <path d="M 35 45 Q 25 10 50 25" stroke="url(#goldGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 165 45 Q 175 10 150 25" stroke="url(#goldGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Olhos -->
    <circle cx="70" cy="90" r="10" fill="#0a0a0a"/>
    <circle cx="130" cy="90" r="10" fill="#0a0a0a"/>
    <!-- Brilho nos olhos -->
    <circle cx="73" cy="87" r="4" fill="#fff"/>
    <circle cx="133" cy="87" r="4" fill="#fff"/>
    <!-- Focinho -->
    <ellipse cx="100" cy="130" rx="40" ry="25" fill="#f5f5f5"/>
    <!-- Nariz -->
    <ellipse cx="85" cy="125" rx="7" ry="5" fill="#0a0a0a"/>
    <ellipse cx="115" cy="125" rx="7" ry="5" fill="#0a0a0a"/>
    <!-- Sorriso -->
    <path d="M 80 140 Q 100 155 120 140" stroke="#0a0a0a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Texto CowBusiness -->
  <text x="250" y="380" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">
    Cow<tspan fill="url(#goldGrad)">Business</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="250" y="420" font-family="Inter, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">
    PREMIUM QUALITY
  </text>
  
  <!-- Linha decorativa -->
  <rect x="175" y="440" width="150" height="3" fill="url(#goldGrad)" rx="1.5"/>
</svg>